<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <!-- Mark JS as active before first paint so reveal styles only hide content when JS can show it. -->
  <script>document.documentElement.classList.add("js");</script>
  <link rel="icon" type="image/png" href="assets/logo/monogram.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог — Sophie Bilynska Cosmetics</title>
  <meta name="description" content="Каталог преміальної косметики Sophie Bilynska." />  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/barrier.css" />
</head>
<body class="barrier">
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo b-logo" aria-label="Sophie Bilynska"><span class="b-logo-text">Sophie Bilynska</span></a>
      <div class="header-right">
        <div class="lang">
          <button type="button" data-lang="ua">UA</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <!-- Flyout menu -->
  <div class="menu-overlay"></div>
  <nav class="mobile-menu" aria-label="Main menu">
    <button type="button" class="menu-close" aria-label="Close">&times;</button>
    <div class="menu-links">
      <a href="brand.html" data-i18n="nav.about">Бренд</a>
      <div class="menu-group">
        <a href="catalog.html" class="menu-group-head" data-i18n="nav.catalog">Каталог</a>
        <div class="submenu">
          <a href="catalog.html" data-i18n="cat.face">Обличчя</a>
          <a href="catalog.html" data-i18n="cat.body">Тіло</a>
          <a href="catalog.html" data-i18n="cat.hair">Волосся</a>
          <a href="catalog.html" data-i18n="nav.bundles">Набори</a>
        </div>
      </div>
      <a href="contacts.html" data-i18n="nav.contacts">Контакти</a>
      <a href="catalog.html" class="menu-cart"><svg class="cart-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg> <span data-i18n="menu.cart">Кошик</span> <span class="cart-count">0</span></a>
    </div>
  </nav>

  <!-- Catalog: everything lives inside one width-capped, centred container so
       filters, divider and the card grid share the same left/right edges. -->
  <div class="catalog-container">
    <!-- Catalog header -->
    <section class="b-sec b-catalog-head" style="border-top:0;padding-top:clamp(60px,9vh,110px);padding-bottom:0">
      <h1 class="b-cat-title">
        <span class="b-cat-collection" data-i18n="b.p4k1">Колекція</span>
        <span class="b-cat-main" data-i18n="catalog.title">Каталог</span>
      </h1>

      <div class="b-toolbar reveal" data-delay="1">
        <div class="filters b-filters">
          <button type="button" class="chip active" data-i18n="filter.all">Усі</button>
          <button type="button" class="chip" data-i18n="cat.face">Обличчя</button>
          <button type="button" class="chip" data-i18n="cat.body">Тіло</button>
          <button type="button" class="chip" data-i18n="cat.hair">Волосся</button>
        </div>
      </div>
    </section>

    <section class="b-sec" style="border-top:0;padding-top:clamp(16px,2.5vw,26px)">
      <div class="grid b-catalog-grid" id="catalog-grid"></div>
    </section>
  </div>

  <footer class="footer">
    <div class="footer-bottom">
      © 2026 Sophie Bilynska Cosmetics — <span data-i18n="foot.rights">Усі права захищено.</span>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/barrier-fx.js"></script>
</body>
</html>
